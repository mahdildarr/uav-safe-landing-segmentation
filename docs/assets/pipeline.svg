<svg xmlns="http://www.w3.org/2000/svg" width="960" height="350" viewBox="0 0 960 350" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c8962e"/></marker>
    <marker id="s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#f0d79e"/></marker>
  </defs>
  <rect width="960" height="350" rx="14" fill="#ffffff"/>
  <text x="32" y="38" font-size="18" font-weight="700" fill="#1d2733">Safe landing from a single nadir image</text>
  <text x="32" y="60" font-size="12.5" fill="#5b6775">Pixel-level scene understanding, explicit safety rules, and evaluation of the landing decision itself</text>

  <!-- 1 image -->
  <g transform="translate(32,88)">
    <rect width="160" height="226" rx="10" fill="#eef3f8" stroke="#c9d3dd"/>
    <text x="14" y="26" font-size="11" font-weight="700" fill="#2c5578" letter-spacing=".6">1 · AERIAL IMAGE</text>
    <rect x="22" y="40" width="116" height="96" fill="#82be4b"/>
    <rect x="22" y="94" width="116" height="20" fill="#80808a"/>
    <rect x="30" y="46" width="34" height="30" fill="#aa6e46"/>
    <circle cx="112" cy="60" r="12" fill="#236e2d"/>
    <circle cx="96" cy="74" r="8" fill="#236e2d"/>
    <rect x="70" y="98" width="16" height="10" fill="#fadc00"/>
    <circle cx="118" cy="124" r="3.5" fill="#dc1e3c"/>
    <text x="80" y="158" font-size="11.5" fill="#1d2733" text-anchor="middle">Semantic Drone Dataset</text>
    <text x="80" y="175" font-size="11" fill="#5b6775" text-anchor="middle">6000×4000 px · 5–30 m</text>
    <text x="80" y="198" font-size="11" fill="#5b6775" text-anchor="middle">dataset classes → 8 landing</text>
    <text x="80" y="213" font-size="11" fill="#5b6775" text-anchor="middle">classes (taxonomy)</text>
  </g>
  <line x1="196" y1="201" x2="226" y2="201" stroke="#c8962e" stroke-width="2.2" marker-end="url(#a)"/>

  <!-- 2 U-Net -->
  <g transform="translate(230,88)">
    <rect width="250" height="226" rx="10" fill="#2c5578"/>
    <text x="14" y="26" font-size="11" font-weight="700" fill="#f0d79e" letter-spacing=".6">2 · SEGMENTATION CNN</text>
    <g fill="#5d8db6">
      <rect x="16" y="44" width="16" height="70"/><rect x="40" y="62" width="16" height="52"/><rect x="64" y="80" width="16" height="34"/><rect x="88" y="96" width="16" height="18"/>
      <rect x="117" y="104" width="16" height="10" fill="#f0d79e"/>
      <rect x="146" y="96" width="16" height="18"/><rect x="170" y="80" width="16" height="34"/><rect x="194" y="62" width="16" height="52"/><rect x="218" y="44" width="16" height="70"/>
    </g>
    <g stroke="#f0d79e" stroke-width="1.3" stroke-dasharray="3 3" fill="none">
      <path d="M33 52 H216" marker-end="url(#s)"/><path d="M57 70 H192" marker-end="url(#s)"/><path d="M81 88 H168" marker-end="url(#s)"/><path d="M105 102 H144" marker-end="url(#s)"/>
    </g>
    <text x="125" y="136" font-size="10.5" fill="#d7e3ee" text-anchor="middle">encoder · skip connections · decoder</text>
    <g fill="#ffffff">
      <text x="16" y="164" font-size="12.5" font-weight="700">U-Net from scratch</text>
      <text x="16" y="180" font-size="11" fill="#d7e3ee">vs ResNet-34 U-Net, DeepLabV3+</text>
      <text x="16" y="202" font-size="12.5" font-weight="700">Imbalance-aware losses</text>
      <text x="16" y="217" font-size="11" fill="#d7e3ee">CE · Dice · focal · class weights</text>
    </g>
  </g>
  <line x1="484" y1="201" x2="514" y2="201" stroke="#c8962e" stroke-width="2.2" marker-end="url(#a)"/>

  <!-- 3 landing search -->
  <g transform="translate(518,88)">
    <rect width="190" height="226" rx="10" fill="#eef3f8" stroke="#c9d3dd"/>
    <text x="14" y="26" font-size="11" font-weight="700" fill="#2c5578" letter-spacing=".6">3 · LANDING SEARCH</text>
    <rect x="22" y="40" width="146" height="74" fill="#82be4b"/>
    <rect x="22" y="40" width="40" height="74" fill="#aa6e46"/>
    <circle cx="150" cy="58" r="3.5" fill="#dc1e3c"/>
    <circle cx="150" cy="58" r="22" fill="none" stroke="#dc1e3c" stroke-dasharray="3 2"/>
    <circle cx="98" cy="84" r="13" fill="none" stroke="#ffffff" stroke-width="2.5"/>
    <circle cx="98" cy="84" r="3.5" fill="#00c853"/>
    <g font-size="11.5" fill="#1d2733">
      <text x="14" y="138">• safe surface, conf ≥ 0.6</text>
      <text x="14" y="158">• static clearance</text>
      <text x="14" y="178">• dynamic clearance</text>
      <text x="26" y="193" font-size="10.5" fill="#5b6775">(people, vehicles)</text>
      <text x="14" y="213">• rank + NMS → top-3</text>
    </g>
  </g>
  <line x1="712" y1="201" x2="742" y2="201" stroke="#c8962e" stroke-width="2.2" marker-end="url(#a)"/>

  <!-- 4 evaluation -->
  <g transform="translate(746,88)">
    <rect width="182" height="226" rx="10" fill="#ffffff" stroke="#2c5578" stroke-width="1.5"/>
    <text x="14" y="26" font-size="11" font-weight="700" fill="#2c5578" letter-spacing=".6">4 · EVALUATION</text>
    <g font-size="12" fill="#1d2733">
      <text x="14" y="56" font-weight="700">Segmentation</text>
      <text x="14" y="72" font-size="11" fill="#5b6775">mIoU · per-class IoU</text>
      <text x="14" y="98" font-weight="700">Landing decision</text>
      <text x="14" y="114" font-size="11" fill="#5b6775">zone precision</text>
      <text x="14" y="129" font-size="11" fill="#5b6775">hazard violation rate</text>
      <text x="14" y="155" font-weight="700">Leakage check</text>
      <text x="14" y="171" font-size="11" fill="#5b6775">random vs blocked split</text>
      <text x="14" y="197" font-weight="700">Edge deployment</text>
      <text x="14" y="213" font-size="11" fill="#5b6775">ONNX · INT8 · FPS vs mIoU</text>
    </g>
  </g>
</svg>
